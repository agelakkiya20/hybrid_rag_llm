
project:
  name: "Hybrid RAG"
  version: "1.0"

document:
  chunk_size: 400
  chunk_overlap: 60

retrieval:
  bm25_top_k: 50
  dense_top_k: 50
  fusion_top_k: 30
  final_top_k: 5

models:
  embedding_model: "BAAI/bge-small-en-v1.5"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

evaluation:
  random_seed: 42
  recall_k: [1, 5, 10, 20]

generation:
  temperature: 0.0
  max_tokens: 500